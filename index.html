<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campus planner home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600;700&amp;family=Space+Grotesk:wght@300;700&amp;display=swap">
<style>
body{margin:0;background:#121614;color-scheme:dark}
:root{--font-display:'Instrument Serif',Georgia,serif;--font-ui:'Geist',system-ui,sans-serif;--font-body:'Geist',system-ui,sans-serif;--font-mono:'Geist Mono',ui-monospace,monospace;--font-brand:'Space Grotesk',system-ui,sans-serif}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:400!important;letter-spacing:-0.01em}
#int-h,#up-h{font-size:42px!important;line-height:1!important}
#week-h{font-size:32px!important;line-height:1.05!important}
#grp-h,#dl-h{font-size:22px!important;line-height:1.1!important}
#interests h3{font-size:26px!important}
#interests h3 span{font-family:var(--font-ui);font-size:13px!important;letter-spacing:0}
#updates h3{font-size:56px!important;line-height:1.02!important}
#dlg-h{font-size:50px!important;line-height:1.02!important}
#dlg-h + div span{font-family:var(--font-ui)}
p{font-family:var(--font-body)}
input::placeholder{color:#7D8A81}
a{color:#BCC9BE}a:hover{color:#FFFFFF}
button{font-family:inherit}
::selection{background:#BCC9BE;color:#1B3D31}
</style>

</head><body>
<div id="root"></div>
<template id="tpl">

<div style="position: relative; min-height: 100vh; background-color: #121614; background-image: radial-gradient(80% 50% at 50% -10%, rgba(78,138,114,0.18), transparent 70%), linear-gradient(rgba(188,201,190,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(188,201,190,0.04) 1px, transparent 1px); background-size: 100% 100%, 56px 56px, 56px 56px; font-family: var(--font-ui); color: #EEF2EE">

<header style="background: rgba(18,22,20,0.9); border-bottom: 1px solid #2F3632">
<div style="max-width: 1440px; margin: 0 auto; padding: 14px 32px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<a href="#week" aria-label="unmute home" style="display: flex; align-items: center; gap: 6px; text-decoration: none; color: #EEF2EE">
<svg viewBox="0 0 120 120" width="34" height="34" aria-hidden="true"><path d="M24 18 V66 A36 36 0 0 0 96 66 V18" fill="none" stroke="#EEF2EE" stroke-width="13"></path><rect x="40" y="40" width="26" height="9" fill="#D2581F"></rect><rect x="40" y="55" width="34" height="9" fill="#BCC9BE"></rect><rect x="40" y="70" width="18" height="9" fill="#4E8A72"></rect></svg>
<span style="font-family: var(--font-brand); font-size: 26px; letter-spacing: -0.05em; line-height: 1"><span style="font-weight: 700">un</span><span style="font-weight: 300; color: #8E9A91">mute</span></span>
</a>
<nav aria-label="Main" style="display: flex; gap: 4px; flex-wrap: wrap">
<a href="#week" style="padding: 8px 14px; border-radius: 4px; background: #2C302C; font-size: 14px; font-weight: 500; text-decoration: none">Home</a>
<a href="#interests" style="padding: 8px 14px; border-radius: 4px; font-size: 14px; font-weight: 500; text-decoration: none; color: #8E9A91">Explore</a>
</nav>
<div style="position: relative; display: flex; align-items: center; gap: 12px">
<button type="button" aria-expanded="{{dropOpen}}" onClick="{{toggleDrop}}" style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border: 1px solid #2F3632; border-radius: 4px; background: #1A1F1C; font-size: 14px; font-weight: 500; color: #EEF2EE; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
Deadlines
<span style="font-size: 12px; font-weight: 700; color: #FFF4EC; background: #A7410F; border-radius: 3px; padding: 1px 7px">{{dlCount}}</span>
</button>
<sc-if value="{{dropOpen}}" hint-placeholder-val="{{ false }}">
<div role="dialog" aria-label="Deadlines this week" style="position: absolute; top: 52px; right: 48px; width: 340px; background: #1A1F1C; border: 1px solid #2F3632; border-radius: 6px; box-shadow: 0 16px 40px rgba(0,0,0,0.5); padding: 14px; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; align-items: center; padding: 2px 4px 6px"><span style="font-size: 15px; font-weight: 600">Deadlines</span><span style="font-size: 12px; color: #8E9A91">This week</span></div>
<sc-for list="{{dlAll}}" as="x" hint-placeholder-count="4">
<button type="button" onClick="{{x.open}}" style="display: flex; align-items: center; gap: 10px; padding: 10px; border: 0; border-radius: 4px; background: {{x.rowBg}}; cursor: pointer; text-align: left; color: #EEF2EE">
<span style="{{x.pillStyle}}">{{x.short}}</span>
<span style="display: flex; flex-direction: column; gap: 2px; flex: 1"><span style="font-size: 14px; font-weight: 500">{{x.title}}</span><span style="font-size: 12px; color: #8E9A91">{{x.when}}</span></span>
</button>
</sc-for>
</div>
</sc-if>
<div aria-label="Your profile" role="img" style="width: 36px; height: 36px; border-radius: 50%; background: #2F3632; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: #D3DCD5">ME</div>
</div>
</div>
</header>
<sc-if value="{{bannerOpen}}" hint-placeholder-val="{{ true }}">
<div role="status" style="background: #0D110F; color: #FFFFFF; border-bottom: 1px solid rgba(232,116,58,0.5)">
<div style="max-width: 1440px; margin: 0 auto; padding: 10px 32px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
<span style="display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; font-family: var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: #E8743A; white-space: nowrap"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: #E8743A; box-shadow: 0 0 0 4px rgba(232,116,58,0.25)"></span>Live on campus</span><span style="font-size: 12px; font-weight: 600; font-family: var(--font-mono); border: 1px solid #E8743A; color: #E8743A; border-radius: 3px; padding: 2px 10px; font-variant-numeric: tabular-nums">{{countdownShort}} left</span>
<span style="font-size: 15px; font-weight: 500; flex: 1 1 320px">{{urgent.title}} closes tonight at 11:59 PM · {{urgent.source}}</span>
<button type="button" onClick="{{urgent.open}}" style="height: 34px; padding: 0 14px; border: 0; border-radius: 4px; background: #A7410F; color: #FFF4EC; font-size: 14px; font-weight: 600; cursor: pointer">Open form</button>
<button type="button" aria-label="Dismiss" onClick="{{hideBanner}}" style="width: 34px; height: 34px; border: 0; border-radius: 4px; background: transparent; color: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg></button>
</div>
</div>
</sc-if>

<main style="max-width: 1440px; margin: 0 auto; padding: 32px 32px 64px; display: flex; flex-direction: column; gap: 40px">
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 32px; padding: 8px 0 4px">
<h1 style="margin: 0; font-size: 44px; line-height: 1.1; letter-spacing: -0.005em; max-width: 960px; color: #EEF2EE">Good evening. <span style="color: #BCC9BE">7 things</span> on your week, <em style="color: #E8743A">1 closes tonight.</em></h1>
<p style="margin: 0; display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #8E9A91"><span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 50%; background: #BCC9BE; box-shadow: 0 0 0 4px rgba(188,201,190,0.18)"></span>Thu 15 Oct · 6 groups listening</p>
</div>


<div style="display: flex; flex-direction: column; gap: 16px">
<div role="region" aria-label="Closing soon" style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; background: #24170F; border: 1px solid #4A2614; border-radius: 6px; padding: 12px 16px">
<span style="font-size: 14px; font-weight: 600; color: #E8743A; white-space: nowrap">Closing soon</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px; flex: 1 1 400px; min-width: 0">
<sc-for list="{{dlAll}}" as="c" hint-placeholder-count="4">
<button type="button" onClick="{{c.open}}" style="display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px 0 6px; border: 1px solid #4A2614; border-radius: 3px; background: #1A1F1C; font-size: 13px; font-weight: 500; color: #EEF2EE; cursor: pointer; white-space: nowrap"><span style="{{c.pillStyle}}">{{c.short}}</span>{{c.title}}</button>
</sc-for>
</div>
<button type="button" onClick="{{toggleDrop}}" style="height: 34px; padding: 0 8px; border: 0; background: transparent; font-size: 13px; font-weight: 500; color: #E8743A; cursor: pointer; white-space: nowrap">See all</button>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: stretch">
<aside aria-labelledby="grp-h" style="flex: 1 1 0; min-width: 220px; background: #1A1F1C; border: 1px solid #2F3632; border-radius: 8px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; justify-content: space-between">
<h2 id="grp-h" style="margin: 0; font-size: 18px; font-weight: 600">Your groups</h2>
<span style="font-size: 12px; color: #8E9A91">{{groupCount}} connected</span>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{chatGroups}}" as="gr" hint-placeholder-count="6">
<div style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 4px">
<span aria-hidden="true" style="{{gr.avatarStyle}}">{{gr.initials}}</span>
<span style="display: flex; flex-direction: column; gap: 1px; flex: 1; min-width: 0">
<span style="font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{gr.name}}</span>
<span style="font-size: 12px; color: #8E9A91">{{gr.status}}</span>
</span>
<sc-if value="{{gr.hasNew}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 11px; font-weight: 700; color: #E8743A; background: #2E1A0F; border-radius: 3px; padding: 2px 8px">{{gr.newCount}} new</span>
</sc-if>
</div>
</sc-for>
</div>
<sc-if value="{{addOpen}}" hint-placeholder-val="{{ false }}">
<form onSubmit="{{connectGroup}}" style="display: flex; flex-direction: column; gap: 8px; padding: 12px; border: 1px solid #2F3632; border-radius: 6px; background: #161B18">
<label for="invite" style="font-size: 13px; font-weight: 500">Paste the group’s invite link</label>
<input id="invite" type="url" placeholder="https://chat.whatsapp.com/…" style="height: 38px; padding: 0 10px; border: 1px solid #46504A; border-radius: 4px; background: #1A1F1C; font-family: inherit; font-size: 13px">
<p style="margin: 0; font-size: 12px; line-height: 1.45; color: #8E9A91">Our bot joins as a silent listener. It never posts. Ask your group admin if you’re unsure.</p>
<div style="display: flex; gap: 8px">
<button type="submit" style="flex: 1; height: 36px; border: 0; border-radius: 4px; background: #BCC9BE; color: #1B3D31; font-size: 13px; font-weight: 500; cursor: pointer">Connect</button>
<button type="button" onClick="{{toggleAdd}}" style="flex: 1; height: 36px; border: 1px solid #2F3632; border-radius: 4px; background: #1A1F1C; font-size: 13px; font-weight: 500; color: #EEF2EE; cursor: pointer">Cancel</button>
</div>
</form>
</sc-if>
<div style="flex: 1"></div>
<button type="button" onClick="{{toggleAdd}}" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 40px; border: 1px dashed #46504A; border-radius: 4px; background: #1A1F1C; font-size: 14px; font-weight: 500; color: #EEF2EE; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add group</button>
</aside>
<section id="week" aria-labelledby="week-h" style="flex: 3 1 0; min-width: min(100%, 640px); background: #1A1F1C; border: 1px solid #2F3632; border-radius: 8px; padding: 24px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 id="week-h" style="margin: 0; font-size: 24px; font-weight: 600">Your week</h2>
<p style="margin: 0; font-size: 14px; color: #8E9A91">Thu 15 – Wed 21 Oct · 7 things on your calendar</p>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
<div role="group" aria-label="Saved plans" style="display: flex; padding: 4px; gap: 4px; background: #2C302C; border-radius: 4px">
<button type="button" aria-pressed="true" style="height: 32px; padding: 0 12px; border: 0; border-radius: 3px; background: #1A1F1C; box-shadow: 0 1px 2px rgba(0,0,0,0.08); font-size: 13px; font-weight: 500; color: #EEF2EE; cursor: pointer">Plan A · Balanced</button>
<button type="button" aria-pressed="false" style="height: 32px; padding: 0 12px; border: 0; border-radius: 3px; background: transparent; font-size: 13px; font-weight: 500; color: #8E9A91; cursor: pointer">Plan B · Career focus</button>
</div>
<button type="button" style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border: 0; border-radius: 4px; background: #BCC9BE; color: #1B3D31; font-size: 14px; font-weight: 500; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"></path><path d="M19 17v4M17 19h4"></path></svg>
Generate plan
</button>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; font-size: 13px; color: #D3DCD5"><span style="font-size: 11px; font-weight: 600; font-family: var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: #8E9A91">Lines</span><span style="display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 16px; height: 16px; flex: none; border-radius: 50%; background: #1B3D31; color: #BCC9BE; box-shadow: inset 0 0 0 1.5px #4E8A72; display: inline-flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; font-family: var(--font-mono)">E</span>Events</span><span style="display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 16px; height: 16px; flex: none; border-radius: 50%; background: #5E1616; color: #F3DADA; box-shadow: inset 0 0 0 1.5px #9A3434; display: inline-flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; font-family: var(--font-mono)">O</span>Opportunities</span><span style="display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 16px; height: 16px; flex: none; border-radius: 50%; background: #BCC9BE; color: #1B3D31; box-shadow: inset 0 0 0 1.5px #BCC9BE; display: inline-flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; font-family: var(--font-mono)">A</span>Announcements</span><span style="display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 16px; height: 16px; flex: none; border-radius: 50%; background: #A7410F; color: #FFF4EC; box-shadow: inset 0 0 0 1.5px #D2581F; display: inline-flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; font-family: var(--font-mono)">D</span>Deadlines</span></div>
<form onSubmit="{{askSubmit}}" style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border: 1px solid #46504A; border-radius: 6px; background: #161B18">
<div style="display: flex; align-items: center; gap: 10px; background: #1A1F1C; border: 1px solid #2F3632; border-radius: 4px; padding: 6px 6px 6px 14px">
<span style="color: #8E9A91; display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"></path><path d="M19 17v4M17 19h4"></path></svg></span>
<label for="ask" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Ask AI about your week</label>
<input id="ask" type="text" placeholder="Ask anything: “What’s on this weekend?” or “Plan my Thursday around the hackathon”" style="flex: 1; min-width: 0; height: 40px; border: 0; outline: none; background: transparent; font-family: inherit; font-size: 15px; color: #EEF2EE">
<button type="submit" aria-label="Send" style="width: 40px; height: 40px; flex: none; border: 0; border-radius: 4px; background: #BCC9BE; color: #1B3D31; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" style="height: 30px; padding: 0 12px; border: 1px solid #2F3632; border-radius: 3px; background: #1A1F1C; font-size: 13px; color: #D3DCD5; cursor: pointer">Anything on AI this week?</button>
<button type="button" style="height: 30px; padding: 0 12px; border: 1px solid #2F3632; border-radius: 3px; background: #1A1F1C; font-size: 13px; color: #D3DCD5; cursor: pointer">What clashes on Saturday?</button>
<button type="button" style="height: 30px; padding: 0 12px; border: 1px solid #2F3632; border-radius: 3px; background: #1A1F1C; font-size: 13px; color: #D3DCD5; cursor: pointer">Internships for 2nd years</button>
<button type="button" style="height: 30px; padding: 0 12px; border: 1px solid #2F3632; border-radius: 3px; background: #1A1F1C; font-size: 13px; color: #D3DCD5; cursor: pointer">Summarise my groups today</button>
</div>
</form>


<div style="overflow-x: auto">
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; min-width: 600px">

<div style="display: flex; flex-direction: column; gap: 8px; padding: 8px; border: 1.5px solid #BCC9BE; border-radius: 6px; min-height: 280px; background: #1A1F1C">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 4px"><span style="font-size: 11px; font-weight: 600; font-family: var(--font-mono); letter-spacing: -0.02em; white-space: nowrap">Thu 15</span><span style="font-size: 10px; font-weight: 600; color: #1B3D31; background: #BCC9BE; border-radius: 3px; padding: 1px 5px">Today</span></div>
<button type="button" onClick="{{openDetail}}" style="display: flex; flex-direction: column; gap: 3px; text-align: left; padding: 7px 7px; border: 1px solid #46504A; border-left: 3px solid #BCC9BE; border-radius: 4px; background: #2C302C; color: #EEF2EE; cursor: pointer">
<span role="img" aria-label="Announcement" title="Announcement" style="display: flex"><span aria-hidden="true" style="width: 16px; height: 16px; flex: none; border-radius: 50%; background: #BCC9BE; color: #1B3D31; box-shadow: inset 0 0 0 1.5px #BCC9BE; display: inline-flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; font-family: var(--font-mono)">A</span></span>
<span style="font-size: 13px; font-weight: 500">Library open till 10 PM this week</span><span style="display: flex; align-items: baseline; gap: 5px; font-size: 11px; line-height: 1.3; color: #8E9A91"><span aria-hidden="true" style="width: 6px; height: 6px; flex: none; border-radius: 50%; border: 2px solid #BCC9BE; background: #1A1F1C; transform: translateY(1px)"></span>Central library</span>
</button>
</div>

<div style="display: flex; flex-direction: column; gap: 8px; padding: 8px; border: 1px solid #2F3632; border-radius: 6px; min-height: 280px; background: #1A1F1C">
<span style="font-size: 11px; font-weight: 600; font-family: var(--font-mono); letter-spacing: -0.02em; white-space: nowrap">Fri 16</span>
<button type="button" onClick="{{openDetail}}" style="display: flex; flex-direction: column; gap: 3px; text-align: left; padding: 7px 7px; border: 1px solid #2A4A3D; border-left: 3px solid #4E8A72; border-radius: 4px; background: #16271F; color: #EEF2EE; cursor: pointer">
<span role="img" aria-label="Event" title="Event" style="display: flex"><span aria-hidden="true" style="width: 16px; height: 16px; flex: none; border-radius: 50%; background: #1B3D31; color: #BCC9BE; box-shadow: inset 0 0 0 1.5px #4E8A72; display: inline-flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; font-family: var(--font-mono)">E</span></span>
<span style="font-size: 13px; font-weight: 500">Coding club weekly meet</span>
<span style="font-size: 12px; color: #8E9A91">5:00 PM</span><span style="display: flex; align-items: baseline; gap: 5px; font-size: 11px; line-height: 1.3; color: #8E9A91"><span aria-hidden="true" style="width: 6px; height: 6px; flex: none; border-radius: 50%; border: 2px solid #BCC9BE; background: #1A1F1C; transform: translateY(1px)"></span>Lab 3</span>
</button>
</div>

<div style="display: flex; flex-direction: column; gap: 8px; padding: 8px; border: 1px solid #2F3632; border-radius: 6px; min-height: 280px; background: #1A1F1C">
<span style="font-size: 11px; font-weight: 600; font-family: var(--font-mono); letter-spacing: -0.02em; white-space: nowrap">Sat 17</span>
